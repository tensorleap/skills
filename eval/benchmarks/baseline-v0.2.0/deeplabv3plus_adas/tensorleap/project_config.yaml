# Config read by the Tensorleap integration code under tensorleap/ (no secrets here).

# Data volume root. Split recipes under domain_gap/data/splits reference every image/GT
# as a bucket-relative path (Cityscapes/..., KITTI/...) resolved against this root.
data_root: /Users/orram/Tensorleap/data/domain-gap-2

# Split recipes bundled with the integration (relative to the repo root).
labeled_splits_dir: domain_gap/data/splits/original_csv_subset
unlabeled_manifest: domain_gap/data/splits/unlabeled_subset/manifest.json

# Keras model used by the local integration test (the platform gets its own upload).
model_path: models/DeeplabV3.h5

# Cap on samples per subset (training / validation / unlabeled), applied after a seeded
# shuffle so the Cityscapes/KITTI mix of each recipe is preserved. Set to 0 or remove
# to evaluate the full recipes.
sample_limit_per_split: 250
seed: 42

# Model input contract: [width, height] -> normalized_image of shape (height, width, 3).
image_size: [2048, 1024]
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]

num_classes: 19
ignore_train_id: 19

# Visualizers downscale by this factor to keep payloads small.
viz_downscale: 2

# Cityscapes vehicle-metadata fallbacks (KITTI frames ship no vehicle json).
default_vehicle:
  gps_heading: 281.0
  gps_latitude: 50.780881831805594
  gps_longitude: 6.108147476339736
  outside_temperature: 19.5
  speed: 10.81
  yaw_rate: 0.171
